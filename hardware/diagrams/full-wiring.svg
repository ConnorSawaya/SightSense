<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 620" width="680" height="620" role="img"><title>Full wiring of the cane</title><desc>The 12 volt battery feeds the green screw adapter. One pair of wires goes to the 12 volt to 5 volt converter, whose USB-C plug powers the Raspberry Pi. The other goes through a 5 amp fuse and a kill switch to B plus and B minus on the IBT-2 driver. Six wires join the Pi's header to the driver, three limit switches go to Pi pins 29, 31 and 33 with their other legs on pin 39, and the driver's M plus and M minus go to the motor.</desc><rect width="680" height="620" fill="#161616"/><rect x="40" y="40" width="190" height="56" rx="8" fill="#1E1E1E" stroke="#5F5E5A" stroke-width="1" /><text x="135.0" y="59" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">12 V to 5 V converter</text><text x="135.0" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">USB-C plug into the Pi</text><rect x="270" y="40" width="150" height="56" rx="8" fill="#1E1E1E" stroke="#5F5E5A" stroke-width="1" /><text x="345.0" y="59" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Green adapter</text><text x="345.0" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">+ and − screws</text><rect x="460" y="40" width="180" height="56" rx="8" fill="#1E1E1E" stroke="#5F5E5A" stroke-width="1" /><text x="550.0" y="59" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">12 V battery</text><text x="550.0" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">Barrel plug</text><path d="M460 58 L420 58" fill="none" stroke="#E24B4A" stroke-width="3.5" stroke-linejoin="round"/><path d="M460 78 L420 78" fill="none" stroke="#888780" stroke-width="3.5" stroke-linejoin="round"/><path d="M270 58 L230 58" fill="none" stroke="#E24B4A" stroke-width="3.5" stroke-linejoin="round"/><path d="M270 78 L230 78" fill="none" stroke="#888780" stroke-width="3.5" stroke-linejoin="round"/><path d="M135 96 L135 170" fill="none" stroke="#378ADD" stroke-width="3.5" stroke-linejoin="round"/><path d="M395 96 L395 130 L430 130" fill="none" stroke="#E24B4A" stroke-width="3.5" stroke-linejoin="round"/><rect x="430" y="116" width="80" height="28" rx="4" fill="#1E1E1E" stroke="#5F5E5A" stroke-width="1" /><text x="470" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">5 A fuse</text><path d="M510 130 L530 130" fill="none" stroke="#E24B4A" stroke-width="3.5" stroke-linejoin="round"/><rect x="530" y="116" width="100" height="28" rx="4" fill="#1E1E1E" stroke="#5F5E5A" stroke-width="1" stroke-dasharray="4 3"/><text x="580" y="130" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Kill switch</text><path d="M630 130 L660 130 L660 225 L640 225" fill="none" stroke="#E24B4A" stroke-width="3.5" stroke-linejoin="round"/><path d="M375 96 L375 156 L652 156 L652 250 L640 250" fill="none" stroke="#888780" stroke-width="3.5" stroke-linejoin="round"/><rect x="40" y="170" width="190" height="330" rx="8" fill="#1E1E1E" stroke="#5F5E5A" stroke-width="1" /><text x="105" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Raspberry Pi 5</text><rect x="450" y="170" width="190" height="240" rx="8" fill="#1E1E1E" stroke="#5F5E5A" stroke-width="1" /><text x="545" y="192" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">IBT-2 driver</text><rect x="170" y="215" width="60" height="20" rx="3" fill="#A9743B" stroke="#FFFFFF" stroke-width="1" /><text x="200" y="225" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Pin 12</text><rect x="450" y="215" width="70" height="20" rx="3" fill="#A9743B" stroke="#FFFFFF" stroke-width="1" /><text x="485" y="225" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">R_EN</text><path d="M230 225 L450 225" fill="none" stroke="#A9743B" stroke-width="2" stroke-linejoin="round"/><rect x="170" y="240" width="60" height="20" rx="3" fill="#E24B4A" stroke="#FFFFFF" stroke-width="1" /><text x="200" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Pin 16</text><rect x="450" y="240" width="70" height="20" rx="3" fill="#E24B4A" stroke="#FFFFFF" stroke-width="1" /><text x="485" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">RPWM</text><path d="M230 250 L450 250" fill="none" stroke="#E24B4A" stroke-width="2" stroke-linejoin="round"/><rect x="170" y="265" width="60" height="20" rx="3" fill="#1B1B1B" stroke="#FFFFFF" stroke-width="1" /><text x="200" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Pin 17</text><rect x="450" y="265" width="70" height="20" rx="3" fill="#1B1B1B" stroke="#FFFFFF" stroke-width="1" /><text x="485" y="275" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">VCC</text><path d="M230 275 L450 275" fill="none" stroke="#B4B2A9" stroke-width="4.5" stroke-linejoin="round"/><path d="M230 275 L450 275" fill="none" stroke="#1B1B1B" stroke-width="2" stroke-linejoin="round"/><rect x="170" y="290" width="60" height="20" rx="3" fill="#F28C28" stroke="#FFFFFF" stroke-width="1" /><text x="200" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1B1B" text-anchor="middle" dominant-baseline="central">Pin 18</text><rect x="450" y="290" width="70" height="20" rx="3" fill="#F28C28" stroke="#FFFFFF" stroke-width="1" /><text x="485" y="300" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1B1B" text-anchor="middle" dominant-baseline="central">LPWM</text><path d="M230 300 L450 300" fill="none" stroke="#F28C28" stroke-width="2" stroke-linejoin="round"/><rect x="170" y="315" width="60" height="20" rx="3" fill="#F2C230" stroke="#FFFFFF" stroke-width="1" /><text x="200" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1B1B" text-anchor="middle" dominant-baseline="central">Pin 20</text><rect x="450" y="315" width="70" height="20" rx="3" fill="#F2C230" stroke="#FFFFFF" stroke-width="1" /><text x="485" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1B1B" text-anchor="middle" dominant-baseline="central">GND</text><path d="M230 325 L450 325" fill="none" stroke="#F2C230" stroke-width="2" stroke-linejoin="round"/><rect x="170" y="340" width="60" height="20" rx="3" fill="#1D9E75" stroke="#FFFFFF" stroke-width="1" /><text x="200" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">Pin 22</text><rect x="450" y="340" width="70" height="20" rx="3" fill="#1D9E75" stroke="#FFFFFF" stroke-width="1" /><text x="485" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">L_EN</text><path d="M230 350 L450 350" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linejoin="round"/><rect x="585" y="215" width="55" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="612" y="225" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">B+</text><rect x="585" y="240" width="55" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="612" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">B−</text><rect x="585" y="315" width="55" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="612" y="325" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">M+</text><rect x="585" y="340" width="55" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="612" y="350" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">M−</text><rect x="170" y="390" width="60" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="200" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Pin 29</text><rect x="280" y="390" width="130" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="345" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Left switch</text><path d="M230 400 L280 400" fill="none" stroke="#7F77DD" stroke-width="2" stroke-linejoin="round"/><path d="M410 400 L430 400" fill="none" stroke="#888780" stroke-width="2" stroke-linejoin="round"/><rect x="170" y="415" width="60" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="200" y="425" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Pin 31</text><rect x="280" y="415" width="130" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="345" y="425" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Right switch</text><path d="M230 425 L280 425" fill="none" stroke="#7F77DD" stroke-width="2" stroke-linejoin="round"/><path d="M410 425 L430 425" fill="none" stroke="#888780" stroke-width="2" stroke-linejoin="round"/><rect x="170" y="440" width="60" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="200" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Pin 33</text><rect x="280" y="440" width="130" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="345" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Centre switch</text><path d="M230 450 L280 450" fill="none" stroke="#7F77DD" stroke-width="2" stroke-linejoin="round"/><path d="M410 450 L430 450" fill="none" stroke="#888780" stroke-width="2" stroke-linejoin="round"/><rect x="170" y="465" width="60" height="20" rx="4" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="1" /><text x="200" y="475" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">Pin 39</text><path d="M430 400 L430 475 L230 475" fill="none" stroke="#888780" stroke-width="2" stroke-linejoin="round"/><rect x="450" y="450" width="190" height="56" rx="8" fill="#1E1E1E" stroke="#5F5E5A" stroke-width="1" /><text x="545" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E8E6DF" text-anchor="middle" dominant-baseline="central">12 V gear motor</text><path d="M640 325 L664 325 L664 485 L640 485" fill="none" stroke="#D85A30" stroke-width="3.5" stroke-linejoin="round"/><path d="M640 350 L652 350 L652 470 L640 470" fill="none" stroke="#D85A30" stroke-width="3.5" stroke-linejoin="round"/><path d="M40 540 L58 540" fill="none" stroke="#E24B4A" stroke-width="3.5" stroke-linejoin="round"/><text x="66" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="start" dominant-baseline="central">12 V positive (thick)</text><path d="M255 540 L273 540" fill="none" stroke="#888780" stroke-width="3.5" stroke-linejoin="round"/><text x="281" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="start" dominant-baseline="central">Negative or ground</text><path d="M470 540 L488 540" fill="none" stroke="#378ADD" stroke-width="3.5" stroke-linejoin="round"/><text x="496" y="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="start" dominant-baseline="central">5 V USB-C</text><path d="M40 564 L58 564" fill="none" stroke="#D85A30" stroke-width="3.5" stroke-linejoin="round"/><text x="66" y="564" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="start" dominant-baseline="central">Motor wires</text><path d="M255 564 L273 564