<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 530" width="680" height="530" role="img"><title>The talk button on the Raspberry Pi 5</title><desc>A momentary push button in the handle. One lead goes to header pin 9, which is ground. The other goes to header pin 11, which is GPIO17. Both are on the inner row, the fifth and sixth pins from the SD card end. Pin 11 is beside pin 12, which carries the brown driver wire. Neither lead may go on pin 1, 2, 4 or 17.</desc><rect width="680" height="530" fill="#161616"/><rect x="60" y="150" width="560" height="330" rx="12" fill="#1E1E1E" stroke="#5F5E5A" stroke-width="1" /><rect x="80" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="91" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">2</text><rect x="80" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="91" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">1</text><rect x="104" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="115" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">4</text><rect x="104" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="115" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">3</text><rect x="128" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="139" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">6</text><rect x="128" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="139" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">5</text><rect x="152" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="163" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">8</text><rect x="152" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="163" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">7</text><rect x="176" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="187" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">10</text><rect x="176" y="184" width="22" height="20" rx="3" fill="#0B5563" stroke="#66D9E8" stroke-width="1.6" /><text x="187" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">9</text><rect x="200" y="160" width="22" height="20" rx="3" fill="#A9743B" stroke="#FFFFFF" stroke-width="1.2" /><text x="211" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">12</text><rect x="200" y="184" width="22" height="20" rx="3" fill="#0B5563" stroke="#66D9E8" stroke-width="1.6" /><text x="211" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">11</text><rect x="224" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="235" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">14</text><rect x="224" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="235" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">13</text><rect x="248" y="160" width="22" height="20" rx="3" fill="#E24B4A" stroke="#FFFFFF" stroke-width="1.2" /><text x="259" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">16</text><rect x="248" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="259" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">15</text><rect x="272" y="160" width="22" height="20" rx="3" fill="#F28C28" stroke="#FFFFFF" stroke-width="1.2" /><text x="283" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1B1B" text-anchor="middle" dominant-baseline="central">18</text><rect x="272" y="184" width="22" height="20" rx="3" fill="#1B1B1B" stroke="#FFFFFF" stroke-width="1.2" /><text x="283" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">17</text><rect x="296" y="160" width="22" height="20" rx="3" fill="#F2C230" stroke="#FFFFFF" stroke-width="1.2" /><text x="307" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#1B1B1B" text-anchor="middle" dominant-baseline="central">20</text><rect x="296" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="307" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">19</text><rect x="320" y="160" width="22" height="20" rx="3" fill="#1D9E75" stroke="#FFFFFF" stroke-width="1.2" /><text x="331" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">22</text><rect x="320" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="331" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">21</text><rect x="344" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="355" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">24</text><rect x="344" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="355" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">23</text><rect x="368" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="379" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">26</text><rect x="368" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="379" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">25</text><rect x="392" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="403" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">28</text><rect x="392" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="403" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">27</text><rect x="416" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="427" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">30</text><rect x="416" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="427" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">29</text><rect x="440" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="451" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">32</text><rect x="440" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="451" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">31</text><rect x="464" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="475" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">34</text><rect x="464" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="475" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">33</text><rect x="488" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="499" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">36</text><rect x="488" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="499" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">35</text><rect x="512" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="523" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">38</text><rect x="512" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="523" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">37</text><rect x="536" y="160" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="547" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">40</text><rect x="536" y="184" width="22" height="20" rx="3" fill="#2C2C2A" stroke="#5F5E5A" stroke-width="0.8" /><text x="547" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">39</text><rect x="60" y="280" width="100" height="30" rx="4" fill="#444441" stroke="#888780" stroke-width="1" /><text x="110.0" y="295.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">SD card slot</text><rect x="60" y="380" width="100" height="30" rx="4" fill="#444441" stroke="#888780" stroke-width="1" /><text x="110.0" y="395.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">Power button</text><rect x="100" y="450" width="100" height="30" rx="4" fill="#444441" stroke="#888780" stroke-width="1" /><text x="150.0" y="465.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">USB-C power</text><rect x="220" y="450" width="60" height="30" rx="4" fill="#444441" stroke="#888780" stroke-width="1" /><text x="250.0" y="465.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">HDMI</text><rect x="300" y="450" width="60" height="30" rx="4" fill="#444441" stroke="#888780" stroke-width="1" /><text x="330.0" y="465.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">HDMI</text><rect x="290" y="290" width="110" height="80" rx="4" fill="#444441" stroke="#888780" stroke-width="1" /><text x="345.0" y="330.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">Processor</text><rect x="540" y="240" width="80" height="56" rx="4" fill="#444441" stroke="#888780" stroke-width="1" /><text x="580.0" y="268.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">USB 2</text><rect x="540" y="308" width="80" height="56" rx="4" fill="#444441" stroke="#888780" stroke-width="1" /><text x="580.0" y="336.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">USB 3</text><rect x="540" y="376" width="80" height="56" rx="4" fill="#444441" stroke="#888780" stroke-width="1" /><text x="580.0" y="404.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">Ethernet</text><rect x="120" y="26" width="20" height="12" rx="3" fill="#D8484F" stroke="#F09595" stroke-width="1" /><rect x="123" y="38" width="14" height="10" rx="1" fill="#C8C9CC" stroke="#8D9096" stroke-width="1" /><rect x="112" y="48" width="36" height="6" rx="1" fill="#C8C9CC" stroke="#8D9096" stroke-width="1" /><rect x="115" y="54" width="30" height="32" rx="3" fill="#2A2A2A" stroke="#5F5E5A" stroke-width="1" /><text x="160" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#E8E6DF" text-anchor="start" dominant-baseline="central">Talk button, in the handle</text><text x="160" y="54" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="start" dominant-baseline="central">7 mm momentary push button with two leads</text><text x="160" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="start" dominant-baseline="central">Either lead can go to either pin</text><path d="M138 86 L138 124 L44 124 L44 216 L187 216 L187 204" fill="none" stroke="#888780" stroke-width="3" stroke-linejoin="round"/><path d="M122 86 L122 112 L32 112 L32 230 L211 230 L211 204" fill="none" stroke="#3BC9DB" stroke-width="3" stroke-linejoin="round"/><path d="M400 96 L424 96" fill="none" stroke="#888780" stroke-width="3" stroke-linejoin="round"/><text x="432" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="start" dominant-baseline="central">One lead to pin 9: ground</text><path d="M400 118 L424 118" fill="none" stroke="#3BC9DB" stroke-width="3" stroke-linejoin="round"/><text x="432" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="start" dominant-baseline="central">The other lead to pin 11: GPIO17</text><text x="240" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="start" dominant-baseline="central">Inner row, 5th and 6th pins from the SD card end.</text><text x="240" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#E8E6DF" text-anchor="start" dominant-baseline="central">Pin 11 is directly beside the brown wire on pin 12.</text><text x="240" y="258" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="start" dominant-baseline="central">No resistor: the Pi supplies its own pull-up.</text><text x="340" y="506" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#E24B4A" text-anchor="middle" dominant-baseline="central">Keep both leads off pins 1 and 17 (3.3 V) and pins 2 and 4 (5 V).</text></svg>
